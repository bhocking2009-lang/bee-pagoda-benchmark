[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-pagoda-benchmark"
version = "1.0.0"
description = "Cross-platform Benchmark Suite — modern PySide6 desktop app with a CLI engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["benchmark", "linux", "windows", "cpu", "gpu", "ai", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]

dependencies = [
    # PySide6 is the core GUI dependency.
    # For headless / CLI-only use: pip install bee-pagoda-benchmark[cli]
    "PySide6>=6.6",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9",
]
ai = [
    "onnxruntime>=1.16",
    "onnx>=1.14",
    "torch>=2.0",
]
dev = [
    "pyinstaller>=6.0",
]
windows = [
    "pyinstaller>=6.0",
]

[project.scripts]
bee-pagoda     = "app.gui.main:main"
bee-pagoda-cli = "app.core.runner:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Root-level compatibility modules (preserved from the original simple-CLI structure)
[tool.setuptools]
py-modules = ["main", "checks", "config_loader", "plugins_loader"]

[tool.setuptools.package-data]
"app.gui.assets" = ["*.svg", "*.png", "*.ico"]
