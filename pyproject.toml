[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-pagoda-benchmark"
version = "1.0.0"
description = "Linux Benchmark Suite — modern PySide6 desktop app with a CLI engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["benchmark", "linux", "cpu", "gpu", "ai", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]

dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
bee-pagoda     = "app.gui.main:main"
bee-pagoda-cli = "app.core.runner:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.gui.assets" = ["*.svg", "*.png", "*.ico"]
